name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping publish runs racing on the same Central deployment.
concurrency:
  group: publish-maven-central
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A GitHub release publishes the tag's version (a 'v' prefix is stripped) to a Central
      # staging deployment that the steps below promote. Any other trigger keeps the
      # gradle.properties 0.0.0-SNAPSHOT version, which routes to the Central snapshots repository.
      - name: Resolve release version
        id: ver
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      # Drop any staging repository left open by a previous run so the deployment promoted below
      # contains only this run's artifacts. Best effort, and only relevant for the release flow.
      - name: Reset open Central staging repositories
        if: ${{ github.event_name == 'release' }}
        run: |
          set -euo pipefail
          api="https://ossrh-staging-api.central.sonatype.com"
          bearer=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          repositories=$(curl -sS -H "Authorization: Bearer $bearer" "$api/manual/search/repositories?state=open" || echo '{}')
          echo "$repositories" | jq -r '.repositories[]?.key // empty' | while read -r key; do
            echo "Dropping stale open staging repository: $key"
            curl -sS -X POST -H "Authorization: Bearer $bearer" "$api/manual/drop/repository/$key" || true
          done

      # Publishes every module to Maven Central. On a push this uploads the SNAPSHOT to the Central
      # snapshots repository; on a release it uploads the tag version to a staging deployment.
      - name: Publish to Maven Central
        run: |
          set -euo pipefail
          args=(--no-daemon --stacktrace)
          if [ -n "${{ steps.ver.outputs.version }}" ]; then
            args+=("-Pversion=${{ steps.ver.outputs.version }}")
          fi
          ./gradlew "${args[@]}" \
            :project:lib-protobuf-jsonschema:publishMavenPublicationToMavenCentralRepository \
            :project:lib-mcp-server:publishMavenPublicationToMavenCentralRepository \
            :project:lib-mcp-grpc-bridge:publishMavenPublicationToMavenCentralRepository \
            :project:lib-mcp-grpc-bridge-spring-boot-autoconfigure:publishMavenPublicationToMavenCentralRepository

      # Uploading only stages the artifacts in an open repository; this turns that repository into a
      # Central Portal deployment. publishing_type=automatic releases it to Maven Central once
      # validation passes, with no manual review; switch to user_managed to require pressing
      # "Publish" in the portal instead. Snapshots need no promotion, so this runs for releases only.
      - name: Promote and release the staging repository to Maven Central
        if: ${{ github.event_name == 'release' }}
        run: |
          set -euo pipefail
          api="https://ossrh-staging-api.central.sonatype.com"
          bearer=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $bearer" \
            "$api/manual/upload/defaultRepository/io.github.cgardev?publishing_type=automatic" \
            -w '\nHTTP %{http_code}\n'
