# JitPack builds the requested commit so consumers can depend on each published
# module by SHA, for example:
#   com.github.cgardev:grpc-mcp-bridge-kotlin:<commit>
# The project needs a Java 24 toolchain, provisioned here via SDKMAN.
before_install:
  - sdk install java 24.0.2-tem < /dev/null
  - sdk use java 24.0.2-tem
install:
  - >-
    ./gradlew
    :project:lib-protobuf-jsonschema:publishToMavenLocal
    :project:lib-mcp-server:publishToMavenLocal
    :project:lib-mcp-grpc-bridge:publishToMavenLocal
    :project:lib-mcp-grpc-bridge-spring-boot-autoconfigure:publishToMavenLocal
    -x test --no-daemon
